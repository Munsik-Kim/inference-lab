[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diova-compare"
version = "0.1.1"
description = "CPU paired comparison of identified model-output records"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.scripts]
diova-compare = "diova_compare.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
