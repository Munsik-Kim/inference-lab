name: Case016 KV raw records and capacity checks
on:
  pull_request:
    paths: ['cases/016-kv-agent-bench/**', 'tools/showcase/**', 'presentation/**', 'tests/showcase/**', '.github/workflows/case016-checks.yml']
  push:
    branches: [main]
    paths: ['cases/016-kv-agent-bench/**', 'tools/showcase/**', 'presentation/**', 'tests/showcase/**', '.github/workflows/case016-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: case016-cpu-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CUDA_VISIBLE_DEVICES: ''
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6; repository pin
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6; repository pin
        with:
          python-version: '3.12.14'
      - name: Preserve original study; replay all agent and technical raw records on CPU
        run: python -B cases/016-kv-agent-bench/publication/run_checks.py --output "$RUNNER_TEMP/case016" --tests
      - name: Keep receipts even after failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4; repository pin
        with:
          name: case016-cpu-receipts
          path: |
            ${{ runner.temp }}/case016/verification.json
            ${{ runner.temp }}/case016/*.log
            ${{ runner.temp }}/case016/technical-replay/*.json
          if-no-files-found: warn
          retention-days: 14
