name: Case013 agent diagnostics and tool-contract CPU checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recorded-agent-followup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CUDA_VISIBLE_DEVICES: ''
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: '${{ github.workspace }}/packages/diova-compare/src'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Prior frozen follow-up and mitigation identities
        run: |
          mkdir -p "$RUNNER_TEMP/agent-followup"
          python -B research/agent_stability_20261013/verify_public.py --study research/agent_stability_20261013 > "$RUNNER_TEMP/agent-followup/previous-public.log" 2>&1
          python -B research/agent_stability_20261013/audit.py --result research/agent_stability_20261013/records --output "$RUNNER_TEMP/agent-followup/previous-audit.json" > "$RUNNER_TEMP/agent-followup/previous-audit.log" 2>&1
          python -B research/agent_tool_contract_repair_20261014/verify_public.py --study research/agent_tool_contract_repair_20261014 --output "$RUNNER_TEMP/agent-followup/repair-public.json" > "$RUNNER_TEMP/agent-followup/repair-public.log" 2>&1
      - name: Lexer contracts and actual tool-event replay without a model
        run: |
          STUDY=research/agent_tool_contract_repair_20261014
          python -B -m unittest discover -s "$STUDY" -p 'test_*.py' -v > "$RUNNER_TEMP/agent-followup/unit-tests.log" 2>&1
          python -B "$STUDY/analyze.py" --result "$STUDY/records" --inputs "$STUDY/records/inputs" --output "$RUNNER_TEMP/agent-followup/repair-audit" --skip-external-preservation > "$RUNNER_TEMP/agent-followup/repair-audit.log" 2>&1
      - name: Retain CPU receipts and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: case013-agent-followup-cpu
          path: |
            ${{ runner.temp }}/agent-followup/*.json
            ${{ runner.temp }}/agent-followup/*.log
            ${{ runner.temp }}/agent-followup/repair-audit/*.json
          if-no-files-found: warn
          retention-days: 14
