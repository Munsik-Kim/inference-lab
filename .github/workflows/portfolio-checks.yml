name: Portfolio CPU checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  cpu:
    runs-on: ubuntu-24.04
    # Keep the complete suite within the same allowance as feedback-cpu-checks.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6; verified 2026-09-18
        with:
          persist-credentials: false
          fetch-depth: 0 # Historical evidence/protection Git blobs are checked.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6; verified 2026-09-18
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6; verified 2026-09-18
        with:
          node-version: '24.12.0'
      - name: Filter and deep-link unit tests (no npm dependencies)
        run: node tests/showcase/test_state.cjs
      - name: Human annotation export, identity and partial-resume contracts
        run: node --test tests/showcase/test_case012_annotation.cjs
      - name: Install CPU-only requirements in the hosted runner
        run: python -m pip install -r tools/showcase/requirements-cpu.txt
      - name: Docs, source preservation, scalar audits, selector and site
        run: python -B tools/showcase/run_checks.py --output "$RUNNER_TEMP/portfolio-checks"
      - name: Retain CPU check receipts and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4; repository pin
        with:
          name: portfolio-cpu-reports
          path: |
            ${{ runner.temp }}/portfolio-checks/*.json
            ${{ runner.temp }}/portfolio-checks/*.log
          if-no-files-found: warn
          retention-days: 14
