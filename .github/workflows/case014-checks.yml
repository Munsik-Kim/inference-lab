name: Case014 unified recorded evidence and CPU checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: case014-cpu-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CUDA_VISIBLE_DEVICES: ''
  HF_HUB_OFFLINE: '1'
  HF_DATASETS_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
jobs:
  recorded-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # existing verified v6 pin
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # existing verified v6 pin
        with:
          python-version: '3.12.14'
      - name: Install pinned CPU-only publication dependencies in hosted runner
        run: python -m pip install -r cases/014-quantization-compensation/publication/requirements-cpu.txt
      - name: Closed views, raw scalar/CI replay and original plus publication unit tests
        run: python -B cases/014-quantization-compensation/publication/scripts/run_checks.py --output "$RUNNER_TEMP/case014/full" --tests
      - name: Public inventory, excluded files, preserved originals and ZIP identity
        run: python -B cases/014-quantization-compensation/publication/verify.py --output "$RUNNER_TEMP/case014/publication.json"
      - name: Retain actual CPU receipts and logs on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # existing verified v4 pin
        with:
          name: case014-cpu-receipts
          path: |
            ${{ runner.temp }}/case014/full/verification.json
            ${{ runner.temp }}/case014/full/*.log
            ${{ runner.temp }}/case014/full/*-audit.json
            ${{ runner.temp }}/case014/publication.json
          if-no-files-found: warn
          retention-days: 14
